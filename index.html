<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sci‑Fi Explorer</title>
    <style>
        body {
            margin: 0;
            font-family: Segoe UI;
            background: #050816;
            color: #dff;
        }
        .toolbar,
        .path {
            background: #0b1228;
            padding: 8px;
            border-bottom: 1px solid #00e5ff;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            background: #0e2a45;
            color: #0ff;
            border: 1px solid #0ff;
            padding: 6px 10px;
            margin: 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover,
        .sel {
            box-shadow: 0 0 10px #0ff;
        }
        .main {
            display: flex;
            height: calc(100vh - 76px);
        }
        .left {
            flex: 2;
            padding: 10px;
        }
        .right {
            flex: 1;
            border-left: 1px solid #0ff;
            padding: 10px;
            background: #0a1324;
        }
        .tiles {
            display: flex;
            flex-wrap: wrap;
        }
        .item {
            width: 110px;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        .list .head,
        .list .row {
            display: grid;
            grid-template-columns: 50px 1fr 100px 1fr;
            padding: 6px;
            border-bottom: 1px solid #234;
        }
        .list .head {
            font-weight: bold;
        }
        .item:hover,
        .row:hover {
            background: #113355;
        }
        input,
        textarea {
            width: 100%;
            background: #08111f;
            color: #dff;
            border: 1px solid #0ff;
            padding: 4px;
            box-sizing: border-box;
        }
        #app {
            display: none;
        }
        #loginOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050816;
            z-index: 9999;
        }
        .loginCard {
            background: #0a1324;
            border: 1px solid #0ff;
            padding: 28px;
            border-radius: 10px;
            color: #dff;
            min-width: 320px;
            text-align: center;
        }
        .loginCard input {
            width: 100%;
            margin: 10px 0;
            padding: 8px;
            box-sizing: border-box;
        }
        .loginCard button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
        }
        .err {
            color: #ff6b6b;
            height: 18px;
            margin-top: 8px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #0ff;
            opacity: 0.7;
            font-size: 12px;
            margin-top: 8px;
        }
        .file-input-wrapper {
            display: inline-block;
            position: relative;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .path {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .path-text {
            font-weight: bold;
            color: #0ff;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .btn-import {
            background: #1a4a2a;
        }
        .btn-export {
            background: #1a2a4a;
        }
        .btn-backup {
            background: #4a1a2a;
        }
        .success-msg {
            color: #0f0;
            font-size: 12px;
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .success-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div class="loginCard">
            <div class="logo">🚀</div>
            <h2>SCI-FI EXPLORER</h2>
            <label>Enter Password</label>
            <input id="loginPwd" type="password" placeholder="Enter password">
            <button onclick="unlock()">Unlock</button>
            <div id="err" class="err"></div>
            <div class="subtitle">🔐 Secure Access</div>
        </div>
    </div>

    <div id="app">
        <div class="toolbar">
            <div class="btn-group">
                <button onclick="newFolder()">📁 New Folder</button>
                <button onclick="newFile()">📄 New File</button>
                <button onclick="renameItem()">✏️ Rename</button>
                <button onclick="deleteItem()">🗑️ Delete</button>
                <button onclick="back()">⬅️ Back</button>
                <button id="vbtn" onclick="toggleView()">View: Tiles</button>
            </div>
            <div class="btn-group">
                <button class="btn-export" onclick="exportData()">💾 Export JSON</button>
                <button class="btn-import" onclick="document.getElementById('importFile').click()">📂 Import JSON</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                <button class="btn-backup" onclick="resetData()">🔄 Reset</button>
                <span id="saveMsg" class="success-msg">✅ Saved!</span>
            </div>
        </div>
        <div id="path" class="path">
            <span class="path-text" id="pathText">Home</span>
            <span style="font-size:12px;opacity:0.5;">Items: <span id="itemCount">0</span></span>
        </div>
        <div class="main">
            <div class="left">
                <div id="exp"></div>
            </div>
            <div class="right">
                <h3>📋 Information</h3>
                Name<input id="nm" readonly>
                Description<input id="ds">
                Notes<textarea id="nt" rows="12"></textarea>
                <button onclick="save()">💾 Save Details</button>
            </div>
        </div>
    </div>

    <script>
        // Default structure
        let def = {
            name: "Home",
            type: "folder",
            description: "",
            notes: "",
            children: []
        };

        let root = JSON.parse(localStorage.getItem("ExplorerData")) || JSON.parse(JSON.stringify(def));
        let view = localStorage.getItem("ExplorerView") || "tiles";
        let cur = root,
            h = [],
            sel = null;

        function getCurrentTimePassword() {
            const d = new Date();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return hours + minutes;
        }

        function persist() {
            localStorage.setItem("ExplorerData", JSON.stringify(root));
            localStorage.setItem("ExplorerView", view);
        }

        function showSaveMessage() {
            const msg = document.getElementById('saveMsg');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }

        function unlock() {
            const pwdInput = document.getElementById("loginPwd");
            const errDiv = document.getElementById("err");
            const currentPassword = getCurrentTimePassword();
            
            if (pwdInput.value === currentPassword) {
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("app").style.display = "block";
                errDiv.textContent = "";
                render();
            } else {
                errDiv.textContent = "❌ Invalid password";
                pwdInput.value = "";
                pwdInput.focus();
            }
        }

        // Handle Enter key on login
        document.addEventListener('keydown', function(e) {
            const overlay = document.getElementById("loginOverlay");
            if (overlay.style.display !== 'none' && e.key === 'Enter') {
                unlock();
            }
        });

        // Render function
        function render() {
            const pathDiv = document.getElementById("pathText");
            const expDiv = document.getElementById("exp");
            const vbtn = document.getElementById("vbtn");
            const itemCount = document.getElementById("itemCount");
            
            if (!cur) return;
            
            pathDiv.textContent = cur.name || "Home";
            vbtn.textContent = "View: " + (view === "tiles" ? "Tiles" : "List");
            
            expDiv.className = view;
            expDiv.innerHTML = "";

            if (!cur.children) cur.children = [];
            itemCount.textContent = cur.children.length;

            if (view === "tiles") {
                expDiv.classList.add("tiles");
                cur.children.forEach(i => {
                    let d = document.createElement("div");
                    d.className = "item";
                    d.innerHTML = "<div style='font-size:42px'>" + (i.type === "folder" ? "📁" : "📄") + "</div>" + (i.name || "Untitled");
                    d.onclick = function() { pick(i, d); };
                    d.ondblclick = function() { openItem(i); };
                    expDiv.appendChild(d);
                });
            } else {
                expDiv.classList.add("list");
                let header = document.createElement("div");
                header.className = "head";
                header.innerHTML = "<div>Icon</div><div>Name</div><div>Type</div><div>Description</div>";
                expDiv.appendChild(header);
                
                cur.children.forEach(i => {
                    let r = document.createElement("div");
                    r.className = "row";
                    r.innerHTML = "<div>" + (i.type === "folder" ? "📁" : "📄") + "</div><div>" + (i.name || "Untitled") + "</div><div>" + (i.type || "unknown") + "</div><div>" + (i.description || "") + "</div>";
                    r.onclick = function() { pick(i, r); };
                    r.ondblclick = function() { openItem(i); };
                    expDiv.appendChild(r);
                });
            }
        }

        function pick(i, e) {
            document.querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
            if (e) e.classList.add("sel");
            sel = i;
            document.getElementById("nm").value = i.name || "";
            document.getElementById("ds").value = i.description || "";
            document.getElementById("nt").value = i.notes || "";
        }

        function openItem(i) {
            if (i.type === "folder") {
                h.push(cur);
                cur = i;
                sel = null;
                render();
            }
        }

        function save() {
            if (!sel) return;
            sel.description = document.getElementById("ds").value;
            sel.notes = document.getElementById("nt").value;
            persist();
            showSaveMessage();
            render();
        }

        function newFolder() {
            let n = prompt("Enter folder name:");
            if (!n) return;
            if (!cur.children) cur.children = [];
            cur.children.push({
                name: n,
                type: "folder",
                description: "",
                notes: "",
                children: []
            });
            persist();
            showSaveMessage();
            render();
        }

        function newFile() {
            let n = prompt("Enter file name:");
            if (!n) return;
            if (!cur.children) cur.children = [];
            cur.children.push({
                name: n,
                type: "file",
                description: "",
                notes: ""
            });
            persist();
            showSaveMessage();
            render();
        }

        function renameItem() {
            if (!sel) return;
            let n = prompt("Enter new name:", sel.name);
            if (n) {
                sel.name = n;
                persist();
                showSaveMessage();
                render();
            }
        }

        function deleteItem() {
            if (!sel) return;
            if (confirm("Delete " + sel.name + "?")) {
                cur.children = cur.children.filter(x => x !== sel);
                sel = null;
                persist();
                showSaveMessage();
                render();
            }
        }

        function back() {
            if (h.length) {
                cur = h.pop();
                sel = null;
                render();
            }
        }

        function toggleView() {
            view = view === "tiles" ? "list" : "tiles";
            persist();
            render();
        }

        // Export data as JSON file
        function exportData() {
            const dataStr = JSON.stringify(root, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `explorer_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showSaveMessage();
        }

        // Import data from JSON file
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData && importedData.name && importedData.type === "folder") {
                        if (confirm(`Import data will replace all current data. Continue?`)) {
                            root = importedData;
                            cur = root;
                            h = [];
                            sel = null;
                            persist();
                            render();
                            showSaveMessage();
                            alert("✅ Data imported successfully!");
                        }
                    } else {
                        alert("❌ Invalid file format. Please export a valid JSON file.");
                    }
                } catch (err) {
                    alert("❌ Error reading file: " + err.message);
                }
            };
            reader.readAsText(file);
            // Reset the input so same file can be imported again
            event.target.value = '';
        }

        // Reset data (with confirmation)
        function resetData() {
            if (confirm("⚠️ This will delete ALL data and reset to default. Are you sure?")) {
                if (confirm("⚠️ FINAL WARNING: All data will be lost. Continue?")) {
                    root = JSON.parse(JSON.stringify(def));
                    cur = root;
                    h = [];
                    sel = null;
                    persist();
                    render();
                    showSaveMessage();
                    alert("🔄 Data has been reset to default.");
                }
            }
        }

        // Initial render - app hidden until login
        render();
    </script>
</body>
</html>
